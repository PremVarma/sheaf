<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36B874"/>
      <stop offset="1" stop-color="#136B42"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF6F0"/>
    </linearGradient>
    <clipPath id="sheet">
      <rect x="236" y="250" width="552" height="524" rx="46"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#062B19" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#062B19" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(-30 12)">
    <!-- The sheets behind: a sheaf -->
    <rect x="236" y="250" width="552" height="524" rx="46" fill="#FFFFFF" fill-opacity="0.3" filter="url(#soft)" transform="rotate(14 512 774)"/>
    <rect x="236" y="250" width="552" height="524" rx="46" fill="#FFFFFF" fill-opacity="0.55" filter="url(#soft)" transform="rotate(7 512 774)"/>
    <rect x="236" y="250" width="552" height="524" rx="46" fill="url(#paper)" filter="url(#shadow)"/>
    <g clip-path="url(#sheet)">
      <rect x="236" y="250" width="552" height="112" fill="#1A7A4C"/>
      <rect x="236" y="362" width="128" height="412" fill="#D9EFE2"/>
      <g stroke="#BFDCCB" stroke-width="10">
        <line x1="236" y1="465" x2="788" y2="465"/>
        <line x1="236" y1="568" x2="788" y2="568"/>
        <line x1="236" y1="671" x2="788" y2="671"/>
        <line x1="364" y1="362" x2="364" y2="774"/>
        <line x1="505" y1="362" x2="505" y2="774"/>
        <line x1="646" y1="362" x2="646" y2="774"/>
      </g>
      <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="10">
        <line x1="364" y1="250" x2="364" y2="362"/>
        <line x1="505" y1="250" x2="505" y2="362"/>
        <line x1="646" y1="250" x2="646" y2="362"/>
      </g>
      <rect x="516" y="476" width="119" height="81" rx="8" fill="#1A7A4C" fill-opacity="0.16" stroke="#1A7A4C" stroke-width="10"/>
    </g>
  </g>
</svg>
