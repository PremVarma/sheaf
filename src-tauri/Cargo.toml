[package]
name = "sheaf"
version = "0.1.0"
description = "A fast desktop app for viewing and editing Excel workbooks and CSV files"
authors = ["Prem Varma"]
license = "MIT"
repository = "https://github.com/PremVarma/sheaf"
edition = "2021"
rust-version = "1.79"

[lib]
name = "sheaf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
